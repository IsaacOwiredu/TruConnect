<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password — TruConnect</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/password-reset.js" defer></script>
</head>
<body class="auth-body">
  <header class="site-header auth-header"><a class="brand" href="/">tru<span>connect</span><i>.</i></a><a class="text-link" href="/login.html">← Back to log in</a></header>
  <main class="auth-layout">
    <div class="auth-aside"><p class="eyebrow">Account recovery</p><h1>A fresh<br><em>start.</em></h1><p>Choose a new password for your account.</p><div class="auth-aside-art">✳</div></div>
    <section class="auth-panel"><div class="auth-card"><p class="eyebrow">Secure your account</p><h2>Choose a new password</h2><p class="muted">Use at least 12 characters.</p>
      <form id="password-reset-form">
        <label>New password<input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="72" required></label>
        <label>Confirm new password<input type="password" name="confirmPassword" autocomplete="new-password" minlength="12" maxlength="72" required></label>
        <button class="button button-wide" type="submit">Update password <span>→</span></button>
        <p class="form-message" id="password-reset-message" role="status" aria-live="polite" hidden></p>
      </form>
    </div></section>
  </main>
</body>
</html>
