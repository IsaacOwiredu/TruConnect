<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — TruConnect</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/password-reset.js" defer></script>
</head>
<body class="auth-body">
  <header class="site-header auth-header"><a class="brand" href="/">tru<span>connect</span><i>.</i></a><a class="text-link" href="/login.html">← Back to log in</a></header>
  <main class="auth-layout">
    <div class="auth-aside"><p class="eyebrow">Account recovery</p><h1>Get back<br>to <em>good work.</em></h1><p>We’ll email you a secure link to choose a new password.</p><div class="auth-aside-art">✳</div></div>
    <section class="auth-panel"><div class="auth-card"><p class="eyebrow">Forgot your password?</p><h2>Reset password</h2><p class="muted">Enter the email address on your TruConnect account.</p>
      <form id="password-reset-request-form">
        <label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
        <button class="button button-wide" type="submit">Send reset link <span>→</span></button>
        <p class="form-message" id="password-reset-request-message" role="status" aria-live="polite" hidden></p>
      </form>
    </div></section>
  </main>
</body>
</html>
